<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Back to AI Barber</title>
<style>
  :root { --bg:#0d0d0d; --text:#e9e9e9; --muted:#a3a3a3; --gold:#f4a100; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; text-align:center; padding:24px 16px; }
  .card { max-width:420px; }
  h1 { font-size:24px; margin:0 0 8px; color:#fff; }
  p { color:var(--muted); line-height:1.5; margin:0 0 24px; }
  a.btn { display:inline-block; background:var(--gold); color:#111; font-weight:700; text-decoration:none; padding:14px 24px; border-radius:10px; }
</style>
</head>
<body>
<div class="card">
  <h1>Taking you back to AI Barber…</h1>
  <p>If the app doesn't open by itself, tap the button.</p>
  <a class="btn" id="open" href="aibarber://get-paid">Return to AI Barber</a>
</div>
<script>
  // Stripe Connect onboarding lands here (return_url / refresh_url):
  //   /stripe-return?shop=<id>&state=return|refresh  ->  aibarber://get-paid?state=...&shop=...
  // Only known states pass through; the shop id is restricted to UUID characters and encoded.
  (function () {
    var q = new URLSearchParams(location.search);
    var state = q.get('state');
    if (state !== 'return' && state !== 'refresh') state = 'return';
    var shop = (q.get('shop') || '').replace(/[^0-9a-fA-F-]/g, '').slice(0, 36);
    var url = 'aibarber://get-paid?state=' + encodeURIComponent(state) + (shop ? '&shop=' + encodeURIComponent(shop) : '');
    document.getElementById('open').setAttribute('href', url);
    location.replace(url);
  })();
</script>
</body>
</html>
