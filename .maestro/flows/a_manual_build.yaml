appId: com.ibrahim1774.aibarber
---
# (a) Build a site by typing details (three fields) and the stock-photo nudge.
- runFlow: _launch.yaml
- takeScreenshot: 01_start
- tapOn: "Start from scratch"
- takeScreenshot: 02_manual_form
- tapOn: "Jack's Barbershop"
- inputText: "Jack's Barbershop"
- tapOn: "Austin, TX"
- inputText: "Austin, TX"
- tapOn: "\\(512\\) 555-0142"
- inputText: "5125550142"
- tapOn:
    point: "50%,22%"
- scrollUntilVisible:
    element: "Build my website"
- takeScreenshot: 05_before_build
- tapOn: "Build my website"
- extendedWaitUntil:
    visible: "PUBLISH"
    timeout: 20000
- takeScreenshot: 09_edit_tour
# no account yet, so no Edit tour here (it waits for an account); skip it if one is showing
- tapOn:
    text: "Skip tour"
    optional: true
- takeScreenshot: 10_editor_home
- scrollUntilVisible:
    element: "Add photos"
    optional: true
- takeScreenshot: 11_editor_photo_nudge
