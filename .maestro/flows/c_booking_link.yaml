appId: com.ibrahim1774.aibarber
---
# (c) Booking-link path: validation error for a bad link, then a real Booksy-shaped link.
- runFlow: _launch.yaml
- tapOn: "USE MY BOOKING LINK"
- takeScreenshot: 01_booking_link_screen
- tapOn:
    point: "50%,54%"   # the field (tapping the label does not focus it)
- inputText: "not a link"
- pressKey: Enter
- takeScreenshot: 02_bad_link_error
- tapOn:
    point: "50%,54%"   # the field (tapping the label does not focus it)
- eraseText: 30
- inputText: "booksy.com/en-us/12345_jacks-barbershop_barber-shop_austin"
- takeScreenshot: 03_link_typed
- pressKey: Enter
- takeScreenshot: 04_importing
- extendedWaitUntil:
    visible: "PUBLISH"
    timeout: 60000
- takeScreenshot: 05_editor_imported
# no account yet, so no Edit tour here (it waits for an account); skip it if one is showing
- tapOn:
    text: "Skip tour"
    optional: true
