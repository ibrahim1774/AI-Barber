appId: com.ibrahim1774.aibarber
---
# (T3 h) Book + Call button sheets on an imported (booking link) site: link validation.
- runFlow: _launch.yaml
- tapOn: "USE MY BOOKING LINK"
- tapOn:
    point: "50%,33%"
- inputText: "booksy.com/en-us/12345_jacks-barbershop_barber-shop_austin"
- pressKey: Enter
- extendedWaitUntil:
    visible: "OPEN MY SITE.*"
    timeout: 60000
    optional: true
- tapOn:
    text: "OPEN MY SITE.*"
    optional: true
- extendedWaitUntil:
    visible: "PUBLISH"
    timeout: 60000
- tapOn:
    text: "Skip tour"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: t3_h0_imported_editor
