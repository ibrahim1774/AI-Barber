appId: com.ibrahim1774.aibarber
---
# (v) Imported site (3 services, 2 team members): Pages sheet, switch the preview to a service page, edit text on it.
# Taps avoid the floating dev Tools gear (top right) by using chips/points left of it.
- runFlow: _launch.yaml
- tapOn: "USE MY BOOKING LINK"
- tapOn:
    point: "50%,33%"
- inputText: "booksy.com/en-us/12345_jacks-barbershop_barber-shop_austin"
- pressKey: Enter
- extendedWaitUntil:
    visible: "OPEN MY SITE.*"   # the "Here's what we found" review step before the editor
    timeout: 60000
    optional: true
- tapOn:
    text: "OPEN MY SITE.*"
    optional: true
- extendedWaitUntil:
    visible: "PUBLISH"
    timeout: 60000
- tapOn:
    text: "Got it"
    optional: true
- tapOn:
    text: "Skip tour"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 01_editor
- tapOn: "Pages"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02_sheet
- tapOn:
    point: "87%,22%"   # Done
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    point: "87%,9%"   # hamburger, top-left corner (the dev Tools button floats over its centre)
- runFlow:
    when:
      visible: "Go home"   # the dev menu opened instead (the floating Tools button sits over the hamburger): switch that button off, close, retry
    commands:
      - tapOn:
          point: "86%,95%"
      - tapOn:
          point: "91%,47%"
      - tapOn:
          point: "87%,9%"
- tapOn: "Services"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 03_services_page
- tapOn: "Beard Trim"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 04_service_item_page
- tapOn:
    point: "25%,37%"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 05_tap_text
- tapOn:
    point: "25%,37%"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: 05b_second_tap
- extendedWaitUntil:
    visible: "SAVE"
    timeout: 8000
- eraseText: 30
- inputText: "Beard Sculpt"
- takeScreenshot: 06_typed
- tapOn: "SAVE"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 07_after_save
- tapOn:
    point: "87%,9%"   # hamburger, top-left corner (the dev Tools button floats over its centre)
- tapOn: "Services"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 08_services_after
