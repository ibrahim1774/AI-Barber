- extendedWaitUntil:
    visible: "NEVER_ZZZ"
    timeout: 7000
    optional: true
- takeScreenshot: e_500_store
- tapOn:
    point: "87%,94%"
- extendedWaitUntil:
    visible: "NEVER_ZZZ"
