appId: com.ibrahim1774.aibarber
---
- runFlow: { file: _fault.yaml, env: { FPATH: "/api/ios/publish", FMODE: "500", FTIMES: "1", FCLEAR: "" } }
- tapOn: "PUBLISH"
- extendedWaitUntil:
    visible: "NEVER_ZZZ"
    timeout: 8000
    optional: true
- takeScreenshot: a0_500
- tapOn:
    text: "BACK TO EDITOR"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: a0_500_after
