appId: com.ibrahim1774.aibarber
---
# Builds a site via the classic form (name, address, mobile + 3 services). Ends in the editor with the Edit tour's first step up.
- tapOn: "Start from scratch"
- tapOn: "Jack's Barbershop"
- inputText: "Jack's Barbershop"
- tapOn: "512 Congress.*"
- inputText: "Austin, TX"
- tapOn: "\\(512\\) 555-0142"
- inputText: "5125550142"
- tapOn: "Haircut"
- tapOn: "Beard trim"
- tapOn: "Hot towel shave"
- scrollUntilVisible:
    element: "Build my website"
- tapOn: "Build my website"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Tap Publish.*"
    timeout: 30000
