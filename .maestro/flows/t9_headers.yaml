appId: com.ibrahim1774.aibarber
---
# (T9) Store and Bookings headers: no overflow, three pills evenly spaced, no shop name top-left. Run on two simulators (SIM=<udid>, SHOTS prefix via env is not supported; copy names per device).
- runFlow:
    file: _signed_in.yaml
    env: { TIER: store, LAPSE: "" }
- tapOn:
    text: "Skip tour"
    optional: true
- waitForAnimationToEnd
- tapOn: "Bookings, tab.*"
- waitForAnimationToEnd
- takeScreenshot: t9_bookings
- tapOn: "Store, tab.*"
- waitForAnimationToEnd
- takeScreenshot: t9_store
