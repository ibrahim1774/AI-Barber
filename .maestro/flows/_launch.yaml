appId: com.ibrahim1774.aibarber
---
#
# then dismisses the OS "Open in" prompt, the dev-client menu and system prompts (ATT, notifications).
- openLink: exp+aibarber://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8091
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Continue"
    timeout: 120000
    optional: true
- repeat:
    times: 8
    commands:
      - runFlow:
          when:
            visible: "This is the.*"   # dev menu up; the app's notification pre-prompt (not in the a11y tree) may sit over it
          commands:
            - tapOn:
                point: "50%,56%"
      - tapOn:
          text: "Ask App Not to Track"
          optional: true
      - tapOn:
          text: "Continue"
          optional: true
      - tapOn:
          text: "Don’t Allow"
          optional: true
      - tapOn:
          text: "Not Now"
          optional: true
      - runFlow:
          when:
            visible: "This is the.*"   # dev menu at huge text sizes: Continue is off-screen, use the close X
          commands:
            - tapOn:
                point: "88%,55%"
      - runFlow:
          when:
            visible: "Reload"
          commands:
            - tapOn:
                point: "84%,92%"   # switch off the floating dev Tools button
            - tapOn:
                point: "90%,48%"
- extendedWaitUntil:
    visible: ".*booking link.*"
    timeout: 60000
