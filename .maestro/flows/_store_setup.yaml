appId: com.ibrahim1774.aibarber
---
# Store setup + products on a signed-in Store plan. env: PROMPT_TAP ("Update my site" | "Not now"), PREFIX
- tapOn:
    point: "62%,94%"   # Store tab
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}01_store_tab_unset
- tapOn:
    point: "50%,56%"   # SET UP YOUR SHOP (text match hits the heading)
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}02_store_setup
- tapOn: "Offer shipping"   # F6: the label flips the switch on ...
- waitForAnimationToEnd
- scroll
- takeScreenshot: ${PREFIX}03_store_setup_scrolled
- tapOn: "Offer shipping"   # ... and off again (an empty rate would block opening)
- scrollUntilVisible:
    element: "Open my shop"
- tapOn: "Open my shop"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}04_shop_open_no_prompt   # F4: opening the empty shop asks nothing
- takeScreenshot: ${PREFIX}06_store_setup_open
- runFlow:
    when:
      visible: "Store setup"
    commands:
      - tapOn:
          point: "6%,9%"   # back out of Store setup
- waitForAnimationToEnd
- tapOn:
    point: "62%,94%"   # Store tab
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}07_store_empty
# ---- product 1: price edge cases, then a photo ----
- tapOn: "Add product"
- waitForAnimationToEnd
- tapOn: "e.g. Matte pomade"   # the field's placeholder: tapping the "Name" label text does not focus it
- inputText: "Matte pomade"
- tapOn: "Price in dollars"
- inputText: "0"
- takeScreenshot: ${PREFIX}08a_decimal_keypad_done_bar
- tapOn: "Done"   # F6: the decimal keypad now has a Done bar
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}08_price_zero_error
- tapOn: "Price in dollars"
- eraseText: 20
- inputText: "99999999"
- tapOn: "Done"   # F6: the decimal keypad now has a Done bar
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}09_price_huge_error
- tapOn: "Price in dollars"
- eraseText: 20
- inputText: "12.345"
- tapOn: "Done"   # F6: the decimal keypad now has a Done bar
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}10_price_three_decimals_error
- tapOn: "Price in dollars"
- eraseText: 20
- inputText: "12.50"
- tapOn: "Done"   # F6: the decimal keypad now has a Done bar
- tapOn: "Add photo"
- waitForAnimationToEnd
- tapOn: "Library"
- extendedWaitUntil:
    visible: ".*Select up to.*"
    timeout: 15000
- tapOn:
    point: "16%,47%"   # first picture in the library
- takeScreenshot: ${PREFIX}11_picker_selected
- tapOn:
    point: "90%,16%"   # confirm
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}12_form_with_photo
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}12b_shop_button_prompt   # F4: offered with the first product
- tapOn: "${PROMPT_TAP}"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*live!.*"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: ".*live!.*"
    commands:
      - takeScreenshot: ${PREFIX}12c_republished_live
      - tapOn: "Done"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}13_product_with_photo_listed   # F5: Done lands back on the Store tab
# ---- product 2: no photo, decimals, sold out ----
- tapOn: "Add product"
- waitForAnimationToEnd
- tapOn: "e.g. Matte pomade"
- inputText: "Beard oil"
- tapOn: "Price in dollars"
- inputText: "7.5"
- tapOn: "Done"   # F6: the decimal keypad now has a Done bar
- tapOn: "Sold out"   # F6: the label flips the switch
- takeScreenshot: ${PREFIX}14_form_no_photo_sold_out
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}15_two_products
# ---- product 3: the highest allowed price ----
- tapOn: "Add product"
- waitForAnimationToEnd
- tapOn: "e.g. Matte pomade"
- inputText: "Gift card"
- tapOn: "Price in dollars"
- inputText: "10000"
- tapOn: "Done"   # F6: the decimal keypad now has a Done bar
- tapOn: "Save"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}16_max_price_listed
- tapOn: "Edit Beard oil"
- waitForAnimationToEnd
- takeScreenshot: ${PREFIX}17_edit_sold_out_product
