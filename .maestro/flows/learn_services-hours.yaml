appId: com.ibrahim1774.aibarber
---
# Learn clip: Services and hours. Starts on the Bookings tab (Day view). Point taps and one swipe only.
# Settings opens the setup steps: step 1 services, step 2 hours. Never taps Connect or Finish.
- runFlow: { file: learn__pause.yaml, env: { MS: "2500" } }
- tapOn: { point: "80%,9%" }      # Settings (step 1 services)
- runFlow: { file: learn__pause.yaml, env: { MS: "3000" } }
- tapOn: { point: "50%,72%" }     # Continue (step 2 hours)
- runFlow: { file: learn__pause.yaml, env: { MS: "3000" } }
- swipe: { start: "50%,80%", end: "50%,30%", duration: 700 }
- runFlow: { file: learn__pause.yaml, env: { MS: "3000" } }
- runFlow: { file: learn__pause.yaml, env: { MS: "2000" } }
