appId: com.ibrahim1774.aibarber
---
# (g2) Settings: 'Learn how it works' is the first card, opens a LIST of topics (no video), a row opens that topic's video screen, Back returns; reminders switch; dialogs CANCEL only.
- runFlow:
    file: _signed_in.yaml
    env: { TIER: website, LAPSE: "" }
- tapOn:
    text: "Skip tour"
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: "87%,94%"   # Settings tab
- waitForAnimationToEnd
- takeScreenshot: g2_settings_top
- assertVisible: "Learn how it works"
- tapOn: "Learn how it works"
- extendedWaitUntil: { visible: "Quick tour", timeout: 10000 }
- assertVisible: "Your custom website"   # grouped sections with headers
- assertNotVisible: "Pause video"   # the list shows no video
- takeScreenshot: g2_learn_list
- scrollUntilVisible:
    element: "Your booking calendar"
- tapOn: "Your booking calendar"
- extendedWaitUntil: { visible: "Replay", timeout: 10000 }
- assertVisible: "Back"
- assertVisible: "Next: Customers book without an account"
- takeScreenshot: g2_learn_topic
- tapOn: "Back"
- extendedWaitUntil: { visible: "Your custom website", timeout: 10000 }
- scrollUntilVisible:
    element: "Pages"
- tapOn: "Pages"       # a topic without a clip: steps only, no player
- extendedWaitUntil: { visible: "Back", timeout: 10000 }
- assertNotVisible: "Pause video"
- assertVisible: "Next: Design and theme"
- takeScreenshot: g2_learn_topic_steps_only
- tapOn: "Back"
- extendedWaitUntil: { visible: "Your custom website", timeout: 10000 }
- tapOn: "Back"
- scrollUntilVisible:
    element: "Publish reminders"
- tapOn:
    text: "Publish reminders"
- takeScreenshot: g2_reminders_toggled
- scrollUntilVisible:
    element: "Take my website offline"
- tapOn: "Take my website offline"
- takeScreenshot: g2_offline_dialog
- tapOn: "Cancel"
- scrollUntilVisible:
    element: "Delete account"
- tapOn: "Delete account"
- takeScreenshot: g2_delete_dialog
- tapOn: "Cancel"
- assertVisible: "Delete account"
