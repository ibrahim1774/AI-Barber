appId: com.ibrahim1774.aibarber
---
# Builds a site via the classic form (name + 3 services), finishing the area/phone card. Ends in the editor.
- tapOn: "Start from scratch"
- tapOn: "The Gentlemen.*"
- inputText: "Jack's Barbershop"
- tapOn: "Choose Your Colors.*"
- tapOn: "Add your services.*"
- tapOn: "Haircut"
- tapOn: "Beard trim"
- tapOn: "Hot towel shave"
- scrollUntilVisible:
    element: "Build My Barbershop Website"
- tapOn: "Build My Barbershop Website"
- extendedWaitUntil:
    visible: "Don't have"
    timeout: 60000
- tapOn: "Don't have"
- tapOn: "Dallas, TX"
- inputText: "Austin, TX"
- tapOn: "\\(555\\) 123-4567"
- inputText: "5125550142"
- tapOn: "Finish generating"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Tap Publish.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Skip tour"
    optional: true
