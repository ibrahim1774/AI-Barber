appId: com.ibrahim1774.aibarber
---
# Site built + published, Bookings plan seeded, setup wizard finished ("Not now" on the Book-button prompt),
# the Bookings tour skipped. Ends on the Bookings tab with one booking and NO live site base (links gated).
- runFlow: _launch.yaml
- runFlow: _publish_site.yaml
- tapOn: "Done"
- runFlow:
    file: _seed.yaml
    env: { TIER: bookings, LAPSE: "", STRIPE: "", SIGNIN: "true", SIGNOUT: "", EMAIL: "", SITEBASE: "", BOOKING_NAME: "" }
- waitForAnimationToEnd
- runFlow:
    file: _bookings_wizard.yaml
    env: { PROMPT_TAP: "Not now", PREFIX: "w_" }
