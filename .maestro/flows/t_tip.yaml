- inputText: "Jack's Barbershop"
- tapOn: "512 Congress.*"
- inputText: "Austin, TX"
- tapOn: "\\(512\\) 555-0142"
- inputText: "5125550142"
- tapOn:
    point: "50%,22%"
- scrollUntilVisible:
    element: "Build my website"
- tapOn: "Build my website"
- waitForAnimationToEnd:
    timeout: 15000
