appId: com.ibrahim1774.aibarber
---
# Builds a site via the classic form (name, local service area, phone; sample services are added automatically). Ends in the editor.
- tapOn: "Start from scratch"
- tapOn: "Jack's Barbershop"
- inputText: "Jack's Barbershop"
- tapOn: ".*Austin, TX.*"
- inputText: "Austin, TX"
- tapOn: "\\(512\\) 555-0142"
- inputText: "5125550142"
- tapOn:
    point: "50%,22%"
- scrollUntilVisible:
    element: "Build my website"
- tapOn: "Build my website"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Tap Publish.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Got it"
    optional: true
- tapOn:
    text: "Skip tour"
    optional: true
